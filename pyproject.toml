[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-rag"
version = "0.1.0"
description = "A retrieval-augmented generation system built with FastAPI and PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
    "pydantic-settings",
    "pymupdf",
    "python-docx",
    "sentence-transformers",
    "python-multipart",
    "groq",
    "streamlit",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
